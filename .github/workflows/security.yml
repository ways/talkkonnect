name: Security scan

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CGO deps required so the Go toolchain can resolve all packages
      # (go-openal and gopus use CGO; without the headers govulncheck errors out)
      - name: Install CGO dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenal-dev libopus-dev libasound2-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to GitHub Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          # Report critical and high severity only to keep signal/noise ratio high
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()   # upload even when exit-code 1 halts the step above
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
